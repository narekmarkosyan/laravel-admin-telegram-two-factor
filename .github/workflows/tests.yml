name: Tests

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.0'
            testbench: '9.13'
          - laravel: '12.0'
            testbench: '10.0'
          - laravel: '13.0'
            testbench: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with="laravel/framework:^${{ matrix.laravel }}" --with="orchestra/testbench:^${{ matrix.testbench }}"
        env:
          # Laravel 11 has unresolved advisories; this job checks API compatibility only.
          COMPOSER_NO_BLOCKING: ${{ matrix.laravel == '11.0' && '1' || '0' }}
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Run tests
        run: composer test
